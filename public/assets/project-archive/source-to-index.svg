<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Project Archive source to evidence path</title>
  <desc id="desc">A repository commit is reserved for indexing, written through an outbox, and made available to the chat service as a cited evidence packet.</desc>
  <rect width="1200" height="420" fill="#f5eedf"/>
  <g fill="none" stroke="#6a4b37" stroke-width="3">
    <path d="M305 210h145M595 210h145M885 210h110" stroke-dasharray="8 10"/>
  </g>
  <g font-family="IBM Plex Mono, monospace" fill="#2e2924">
    <g transform="translate(50 110)">
      <rect width="255" height="200" rx="12" fill="#e8d8bf" stroke="#6a4b37" stroke-width="2"/>
      <text x="24" y="50" font-size="14" fill="#6a4b37">01 · SOURCE</text>
      <text x="24" y="92" font-size="22">repository commit</text>
      <text x="24" y="128" font-size="14">selected project</text>
      <text x="24" y="156" font-size="14">commit SHA</text>
    </g>
    <g transform="translate(450 110)">
      <rect width="255" height="200" rx="12" fill="#fffaf1" stroke="#53634c" stroke-width="2"/>
      <text x="24" y="50" font-size="14" fill="#53634c">02 · INDEX</text>
      <text x="24" y="92" font-size="22">durable evidence</text>
      <text x="24" y="128" font-size="14">version + queue</text>
      <text x="24" y="156" font-size="14">outbox intent</text>
    </g>
    <g transform="translate(740 110)">
      <rect width="255" height="200" rx="12" fill="#fffaf1" stroke="#53634c" stroke-width="2"/>
      <text x="24" y="50" font-size="14" fill="#53634c">03 · ANSWER</text>
      <text x="24" y="92" font-size="22">source receipt</text>
      <text x="24" y="128" font-size="14">path + line range</text>
      <text x="24" y="156" font-size="14">commit-pinned link</text>
    </g>
  </g>
  <text x="50" y="365" font-family="IBM Plex Mono, monospace" font-size="13" fill="#6a4b37">Audited paths: services/indexing.py · adapters/cosmos/outbox.py · services/chat.py</text>
</svg>
